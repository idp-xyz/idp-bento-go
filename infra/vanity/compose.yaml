services:
  vanity:
    image: idp-bento-go-vanity:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idp-bento-go-vanity
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:8188:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 32m
    cpus: 0.25
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- 'http://127.0.0.1:8080/idp-bento-go?go-get=1'
          | grep -Fq 'go.idp.xyz/idp-bento-go git https://github.com/idp-xyz/idp-bento-go.git'
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
