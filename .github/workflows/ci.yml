name: Framework CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidatecheck:
    name: Candidate gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      IDP_BENTO_POSTGRES_DSN: postgres://idp_bento_ci:idp_bento_ci@127.0.0.1:5432/idp_bento_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16.12-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: idp_bento_ci
          POSTGRES_PASSWORD: idp_bento_ci
          POSTGRES_DB: idp_bento_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idp_bento_ci -d idp_bento_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Verifies signatures against .github/allowed_signers, so it holds without
      # depending on GitHub having the key registered for the signing scope.
      - name: Verify commit signatures
        run: |
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || echo '')"; fi
          if [ -z "$base" ]; then echo "no baseline commit; nothing to verify"; exit 0; fi
          status=0
          for commit in $(git rev-list "$base..HEAD"); do
            state="$(git log -1 --format='%G?' "$commit")"
            printf '%s %s\n' "$state" "$commit"
            case "$state" in G) ;; *) status=1 ;; esac
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::every commit must carry a signature that .github/allowed_signers verifies"
          fi
          exit "$status"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Run candidate gates
        run: go run ./internal/cmd/candidatecheck -initial-v0-1
